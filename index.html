<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TQQQ 200일선 전략 위젯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0f172a !important;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Segoe UI", Roboto, Helvetica, sans-serif;
      color: #f8fafc;
      width: 100vw;
      height: 150px !important;
      max-height: 150px !important;
      padding: 6px 12px 0 12px;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    /* 1. 최상단 가격 & 피카츄 & 배지 */
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 24px;
      padding-right: 22px;
      flex-shrink: 0;
      position: relative;
    }
    .price-group {
      display: flex;
      align-items: center;
      gap: 5px;
      position: relative;
    }
    .tqqq-price {
      font-size: 13.5px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .tqqq-change {
      font-size: 10px;
      font-weight: 700;
    }

    /* 40px 대형 피카츄 */
    .pika-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      margin-left: 2px;
      margin-top: -6px;
      position: relative;
      flex-shrink: 0;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.5));
    }
    .pika-wrapper svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .pill {
      font-size: 8.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .pill-signal {
      font-size: 8.5px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 7px;
    }
    .signal-up {
      background: rgba(34, 197, 94, 0.22);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .signal-down {
      background: rgba(239, 68, 68, 0.22);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .signal-neutral {
      background: rgba(148, 163, 184, 0.18);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .val-up { color: #4ade80; }
    .val-down { color: #f87171; }

    /* 2. 보조 범례 */
    .sub-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8px;
      color: #94a3b8;
      height: 13px;
      margin-top: 1px;
      flex-shrink: 0;
    }
    .legend-box {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      margin-right: 2px;
    }

    /* 3. 차트 영역 */
    .chart-box {
      width: 100%;
      height: 102px !important;
      max-height: 102px !important;
      margin-top: 2px;
      position: relative;
      flex-shrink: 0;
    }
    canvas {
      width: 100%;
      height: 102px !important;
      display: block;
    }
  </style>
</head>
<body>
  <div class="top-row">
    <div class="price-group">
      <span class="tqqq-price" id="tqqqPrice">TQQQ $67.90</span>
      <span class="tqqq-change val-down" id="tqqqChange">-1.37 (-1.98%)</span>
      <div id="pikaWrapper" class="pika-wrapper"></div>
    </div>
    <div class="badge-group">
      <span class="pill" id="strategyState">보유</span>
      <span class="pill val-up" id="strategyReturn">수익 +7.3%</span>
      <span id="todaySignal" class="pill-signal signal-up">보유</span>
    </div>
  </div>

  <div class="sub-row">
    <div class="legend-box">
      <span><span class="dot" style="background:#ffffff;"></span>종가</span>
      <span><span class="dot" style="background:#38bdf8;"></span>200선 <b id="ma200Val" style="color:#e2e8f0;">$62.1</b></span>
    </div>
    <div>
      <span id="diffFrom200" class="val-up" style="font-weight:700;">200선 대비 +9.3%</span>
    </div>
  </div>

  <div class="chart-box" id="chartBox">
    <canvas id="chart"></canvas>
  </div>

  <script>
    // 전역 에러 발생 시에도 뻗지 않도록 방어
    window.onerror = function() { return true; };

    const SETTINGS = {
      baseMA: 200,
      graphDays: 80,
      colors: {
        tqqqClose: "#ffffff",
        ma200: "#38bdf8",
        grid: "rgba(255, 255, 255, 0.07)",
        axisText: "#64748b"
      }
    };

    // 고화질 웃는 피카츄 SVG
    const HAPPY_PIKA_SVG = `
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 32 45 C 22 28 12 10 4 2 C 2 0 6 0 10 1 C 22 6 34 24 42 40 Z" fill="#FED000" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M 4 2 C 2 0 6 0 10 1 C 16 3 20 8 16 16 C 12 14 6 8 4 2 Z" fill="#1E293B"/>
        <path d="M 88 45 C 98 28 108 10 116 2 C 118 0 114 0 110 1 C 98 6 86 24 78 40 Z" fill="#FED000" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M 116 2 C 118 0 114 0 110 1 C 104 3 100 8 104 16 C 108 14 114 8 116 2 Z" fill="#1E293B"/>
        <path d="M 28 54 C 22 66 22 90 38 104 C 50 114 70 114 82 104 C 98 90 98 66 92 54 C 84 40 36 40 28 54 Z" fill="#FED000" stroke="#1E293B" stroke-width="2.5"/>
        <ellipse cx="28" cy="82" rx="9.5" ry="9" fill="#E60012"/>
        <ellipse cx="92" cy="82" rx="9.5" ry="9" fill="#E60012"/>
        <ellipse cx="41" cy="67" rx="6" ry="6.5" fill="#1E293B"/>
        <circle cx="43" cy="65" r="2.5" fill="#FFFFFF"/>
        <ellipse cx="79" cy="67" rx="6" ry="6.5" fill="#1E293B"/>
        <circle cx="77" cy="65" r="2.5" fill="#FFFFFF"/>
        <ellipse cx="60" cy="74" rx="2" ry="1.3" fill="#1E293B"/>
        <path d="M 52 79 C 55 82 58 82 60 79 C 62 82 65 82 68 79" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M 54 81 C 54 92 66 92 66 81 Z" fill="#D84357" stroke="#1E293B" stroke-width="1.8"/>
        <path d="M 56 87 C 60 84 64 84 64 87" fill="#FF8596"/>
      </svg>
    `;

    // 고화질 우는 피카츄 SVG
    const SAD_PIKA_SVG = `
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 34 50 C 22 45 4 36 1 28 C -1 25 2 24 6 25 C 18 28 32 38 42 46 Z" fill="#FED000" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M 1 28 C -1 25 2 24 6 25 C 10 26 12 30 9 34 C 4 32 1 30 1 28 Z" fill="#1E293B"/>
        <path d="M 86 50 C 98 45 116 36 119 28 C 121 25 118 24 114 25 C 102 28 88 38 78 46 Z" fill="#FED000" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M 119 28 C 121 25 118 24 114 25 C 110 26 108 30 111 34 C 116 32 119 30 119 28 Z" fill="#1E293B"/>
        <path d="M 28 54 C 22 66 22 90 38 104 C 50 114 70 114 82 104 C 98 90 98 66 92 54 C 84 40 36 40 28 54 Z" fill="#FED000" stroke="#1E293B" stroke-width="2.5"/>
        <ellipse cx="28" cy="83" rx="9" ry="8.5" fill="#F87171" opacity="0.9"/>
        <ellipse cx="92" cy="83" rx="9" ry="8.5" fill="#F87171" opacity="0.9"/>
        <ellipse cx="42" cy="69" rx="6.5" ry="7" fill="#1E293B"/>
        <circle cx="40" cy="67" r="2.4" fill="#FFFFFF"/>
        <circle cx="44" cy="72" r="1.1" fill="#FFFFFF"/>
        <ellipse cx="78" cy="69" rx="6.5" ry="7" fill="#1E293B"/>
        <circle cx="76" cy="67" r="2.4" fill="#FFFFFF"/>
        <circle cx="80" cy="72" r="1.1" fill="#FFFFFF"/>
        <path d="M 37 74 C 34 84 36 92 40 94 C 44 92 44 84 41 74 Z" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8"/>
        <path d="M 83 74 C 86 84 84 92 80 94 C 76 92 76 84 79 74 Z" fill="#38BDF8" stroke="#0284C7" stroke-width="0.8"/>
        <ellipse cx="60" cy="75" rx="1.8" ry="1.2" fill="#1E293B"/>
        <path d="M 54 85 C 58 81 62 81 66 85" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      </svg>
    `;

    function sma(values, endIdx, period) {
      if (endIdx - period + 1 < 0) return null;
      let sum = 0;
      for (let i = endIdx - period + 1; i <= endIdx; i++) {
        if (values[i] == null) return null;
        sum += values[i];
      }
      return sum / period;
    }

    function buildIndicators(rows) {
      const closes = rows.map(r => r.close);
      return rows.map((row, idx) => {
        const ma200 = sma(closes, idx, SETTINGS.baseMA);
        return { ...row, ma200 };
      });
    }

    function simulateStrategy(tqqqRows) {
      let state = "미보유";
      let entryPrice = null;
      let todaySignal = "관망";

      for (let i = 1; i < tqqqRows.length; i++) {
        const prev = tqqqRows[i - 1];
        const curr = tqqqRows[i];

        if (curr.ma200 == null || prev.ma200 == null) continue;

        const crossUp = prev.close < prev.ma200 && curr.close >= curr.ma200;
        const crossDown = prev.close >= prev.ma200 && curr.close < curr.ma200;

        if (state === "보유" && crossDown) {
          state = "미보유";
          todaySignal = "매도";
        } else if (state === "미보유" && crossUp) {
          state = "보유";
          entryPrice = curr.close;
          todaySignal = "매수";
        } else if (state === "보유") {
          todaySignal = "보유";
        } else {
          todaySignal = "관망";
        }
      }

      const currPrice = tqqqRows[tqqqRows.length - 1]?.close ?? null;
      let strategyReturnPct = null;
      if (state === "보유" && entryPrice && currPrice) {
        strategyReturnPct = ((currPrice / entryPrice) - 1) * 100;
      }

      return { state, todaySignal, strategyReturnPct };
    }

    function drawSmoothLine(ctx, points, color, width, glow = false) {
      if (points.length < 2) return;

      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (glow) {
        ctx.shadowColor = "rgba(255, 255, 255, 0.75)";
        ctx.shadowBlur = 6;
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.moveTo(points[0].x, points[0].y);

      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i === 0 ? 0 : i - 1];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || p2;

        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;

        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawChart(rows) {
      const canvas = document.getElementById("chart");
      if (!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      
      const box = document.getElementById("chartBox");
      const width = (box && box.clientWidth > 50) ? box.clientWidth : (window.innerWidth > 50 ? window.innerWidth - 24 : 320);
      const height = 102;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      const w = width;
      const h = height;

      const pad = { top: 4, right: 28, bottom: 13, left: 4 };

      const values = [];
      rows.forEach(r => {
        if (r.close != null) values.push(r.close);
        if (r.ma200 != null) values.push(r.ma200);
      });

      if (!values.length) return;

      const rawMin = Math.min(...values);
      const rawMax = Math.max(...values);
      const margin = (rawMax - rawMin) * 0.05 || 1;
      const minV = rawMin - margin;
      const maxV = rawMax + margin;

      const chartW = w - pad.left - pad.right;
      const chartH = h - pad.top - pad.bottom;

      // 1. Y축
      ctx.font = "8px -apple-system, sans-serif";
      ctx.fillStyle = SETTINGS.colors.axisText;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";

      const ySteps = [0, 0.5, 1];
      ySteps.forEach(ratio => {
        const y = pad.top + chartH * ratio;
        const priceVal = maxV - (maxV - minV) * ratio;

        ctx.strokeStyle = SETTINGS.colors.grid;
        ctx.setLineDash([2, 3]);
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + chartW, y);
        ctx.stroke();

        ctx.fillText(`$${priceVal.toFixed(0)}`, pad.left + chartW + 3, y);
      });
      ctx.setLineDash([]);

      // 2. X축 날짜
      ctx.textBaseline = "bottom";
      const xIndices = [0, Math.floor((rows.length - 1) / 2), rows.length - 1];
      xIndices.forEach((idx, i) => {
        const r = rows[idx];
        if (!r || !r.date) return;
        const d = new Date(r.date);
        const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
        const x = pad.left + (idx / (rows.length - 1)) * chartW;

        if (i === 0) ctx.textAlign = "left";
        else if (i === xIndices.length - 1) ctx.textAlign = "right";
        else ctx.textAlign = "center";

        ctx.fillText(dateStr, x, h);
      });

      // 3. 곡선
      const seriesConfig = [
        { key: "ma200", color: SETTINGS.colors.ma200, width: 1.8, glow: false },
        { key: "close", color: SETTINGS.colors.tqqqClose, width: 2.4, glow: true }
      ];

      seriesConfig.forEach(s => {
        const points = [];
        rows.forEach((r, idx) => {
          const v = r[s.key];
          if (v != null) {
            const x = pad.left + (idx / (rows.length - 1)) * chartW;
            const y = pad.top + chartH - ((v - minV) / (maxV - minV)) * chartH;
            points.push({ x, y });
          }
        });

        if (s.key === "close" && points.length > 1) {
          const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
          grad.addColorStop(0, "rgba(255, 255, 255, 0.12)");
          grad.addColorStop(1, "rgba(255, 255, 255, 0.0)");
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
          }
          ctx.lineTo(points[points.length - 1].x, pad.top + chartH);
          ctx.lineTo(points[0].x, pad.top + chartH);
          ctx.closePath();
          ctx.fillStyle = grad;
          ctx.fill();
        }

        drawSmoothLine(ctx, points, s.color, s.width, s.glow);
      });
    }

    function renderUI(tqqqData) {
      if (!tqqqData || !tqqqData.length) return;

      const tqqqWithMA = buildIndicators(tqqqData);
      const strategy = simulateStrategy(tqqqWithMA);

      const latestTQQQ = tqqqWithMA[tqqqWithMA.length - 1];
      const prevTQQQ = tqqqWithMA[tqqqWithMA.length - 2] || latestTQQQ;

      // 시그널 배지
      const signalEl = document.getElementById("todaySignal");
      signalEl.textContent = strategy.todaySignal;
      const isBullish = strategy.todaySignal === "매수" || strategy.todaySignal === "보유";
      signalEl.className = "pill-signal " + (isBullish ? "signal-up" : strategy.todaySignal === "매도" ? "signal-down" : "signal-neutral");

      // 피카츄 SVG 즉각 렌더링
      const pikaWrapper = document.getElementById("pikaWrapper");
      pikaWrapper.innerHTML = isBullish ? HAPPY_PIKA_SVG : SAD_PIKA_SVG;

      // 가격
      document.getElementById("tqqqPrice").textContent = `TQQQ $${latestTQQQ.close.toFixed(2)}`;
      const chg = latestTQQQ.close - prevTQQQ.close;
      const chgPct = (chg / prevTQQQ.close) * 100;
      const chgEl = document.getElementById("tqqqChange");
      chgEl.textContent = `${chg >= 0 ? "+" : ""}${chg.toFixed(2)} (${chgPct >= 0 ? "+" : ""}${chgPct.toFixed(2)}%)`;
      chgEl.className = "tqqq-change " + (chg >= 0 ? "val-up" : "val-down");

      // 전략 상태 & 수익률
      document.getElementById("strategyState").textContent = strategy.state;
      const returnEl = document.getElementById("strategyReturn");
      if (strategy.strategyReturnPct != null) {
        returnEl.textContent = `수익 ${strategy.strategyReturnPct >= 0 ? "+" : ""}${strategy.strategyReturnPct.toFixed(1)}%`;
        returnEl.className = "pill " + (strategy.strategyReturnPct >= 0 ? "val-up" : "val-down");
      } else {
        returnEl.textContent = "수익 -";
      }

      // 200일선
      document.getElementById("ma200Val").textContent = `$${latestTQQQ.ma200?.toFixed(1)}`;
      if (latestTQQQ.ma200 != null) {
        const diffPct = ((latestTQQQ.close / latestTQQQ.ma200) - 1) * 100;
        const diffEl = document.getElementById("diffFrom200");
        diffEl.textContent = `200선 대비 ${diffPct >= 0 ? "+" : ""}${diffPct.toFixed(1)}%`;
        diffEl.className = diffPct >= 0 ? "val-up" : "val-down";
      }

      drawChart(tqqqWithMA.slice(-SETTINGS.graphDays));
    }

    // 0초 즉시 기본 피카츄 먼저 꽂아두기
    document.getElementById("pikaWrapper").innerHTML = HAPPY_PIKA_SVG;

    // 네트워크 비동기 fetch
    fetch(`./data.json?t=${Date.now()}`)
      .then(res => res.json())
      .then(data => {
        if (data && data.tqqq) {
          renderUI(data.tqqq);
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
