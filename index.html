<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QQQ / TQQQ 전략 위젯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #111827 0%, #1f2937 100%);
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      gap: 6px;
      user-select: none;
    }

    /* 1. 최상단 헤더 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: #f9fafb;
      letter-spacing: -0.3px;
    }
    .updated-at {
      font-size: 9px;
      color: #6b7280;
    }
    .signal {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
    }
    .signal-up { color: #22c55e; }
    .signal-down { color: #ef4444; }
    .signal-neutral { color: #9ca3af; }

    /* 2. 상단 통합 정보 패널 */
    .info-panel {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(11, 18, 32, 0.45);
      border-radius: 6px;
      padding: 6px 8px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    /* 가격 & 변동 */
    .tqqq-box {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }
    .tqqq-price {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }
    .change {
      font-size: 11px;
      font-weight: 600;
    }
    .qqq-box {
      font-size: 11px;
      color: #9ca3af;
    }

    /* 우측 정보 텍스트 */
    .status-group {
      font-size: 11px;
      color: #d1d5db;
      display: flex;
      gap: 4px;
    }
    .sub-group {
      font-size: 10px;
      color: #9ca3af;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .return-text {
      font-weight: 700;
    }

    .price-up { color: #22c55e; }
    .price-down { color: #ef4444; }

    /* 3. 하단 꽉 찬 차트 */
    .chart-container {
      width: 100%;
      flex: 1;
      min-height: 48px;
      background: rgba(11, 18, 32, 0.65);
      border-radius: 6px;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading {
      position: absolute;
      inset: 0;
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      color: #9ca3af;
      z-index: 10;
    }
  </style>
</head>
<body onclick="init()">
  <div id="loading">데이터 동기화 중...</div>

  <!-- 1. 헤더: 타이틀, 갱신시각, 시그널 배지 -->
  <div class="header">
    <div class="header-left">
      <span class="title">QQQ / TQQQ 전략</span>
      <span class="updated-at" id="updatedAt">갱신 대기</span>
    </div>
    <span id="todaySignal" class="signal">-</span>
  </div>

  <!-- 2. 상단 통합 정보 패널 (모든 수치를 상단으로 집중) -->
  <div class="info-panel">
    <!-- 1행: TQQQ 현재가 + 상태/매도선 -->
    <div class="info-row">
      <div class="tqqq-box">
        <span class="tqqq-price" id="tqqqPrice">TQQQ -</span>
        <span class="change" id="tqqqChange">-</span>
      </div>
      <div class="status-group">
        <span id="strategyState">상태 -</span>
        <span>•</span>
        <span id="activeSellLine">매도선 -</span>
      </div>
    </div>

    <!-- 2행: QQQ 종가 + 진입일/전략수익률 + 이평선 요약 -->
    <div class="info-row">
      <div class="qqq-box">
        <span id="qqqPrice">QQQ -</span>
      </div>
      <div class="sub-group">
        <span id="entryDate">진입일 -</span>
        <span id="strategyReturn" class="return-text">전략 -</span>
        <span>|</span>
        <span id="maDetails">3일 - / 161일 -</span>
      </div>
    </div>
  </div>

  <!-- 3. 하단 차트 (위쪽 정보를 제외한 남은 공간을 차지) -->
  <div class="chart-container">
    <canvas id="chart"></canvas>
  </div>

  <script>
    const SETTINGS = {
      shortMA: 3,
      sellMA: 161,
      baseMA: 185,
      envelopePct: 0.05,
      graphDays: 90,
      colors: {
        qqqClose: "#e5e7eb",
        ma3: "#f59e0b",
        ma161: "#3b82f6",
        ma185: "#10b981",
        env185: "#ef4444",
        grid: "#374151"
      }
    };

    function sma(values, endIdx, period) {
      if (endIdx - period + 1 < 0) return null;
      let sum = 0;
      for (let i = endIdx - period + 1; i <= endIdx; i++) {
        if (values[i] == null) return null;
        sum += values[i];
      }
      return sum / period;
    }

    function buildIndicators(rows) {
      const closes = rows.map(r => r.close);
      return rows.map((row, idx) => {
        const ma3 = sma(closes, idx, SETTINGS.shortMA);
        const ma161 = sma(closes, idx, SETTINGS.sellMA);
        const ma185 = sma(closes, idx, SETTINGS.baseMA);
        const envUpper = ma185 != null ? ma185 * (1 + SETTINGS.envelopePct) : null;
        return { ...row, ma3, ma161, ma185, envUpper };
      });
    }

    function simulateStrategy(qqqRows, tqqqRows) {
      let state = "미보유";
      let activeSellLine = "-";
      let blockReentryToday = false;
      let entryDate = null;
      let entryPrice = null;
      let todaySignal = "관망";

      for (let i = 1; i < qqqRows.length; i++) {
        const prev = qqqRows[i - 1];
        const curr = qqqRows[i];

        if (![prev.ma3, prev.ma161, prev.ma185, prev.envUpper, curr.ma3, curr.ma161, curr.ma185, curr.envUpper].every(v => v != null)) {
          continue;
        }

        blockReentryToday = false;
        let tradedToday = false;
        const tqqqPrice = tqqqRows[Math.min(i, tqqqRows.length - 1)]?.close ?? null;

        const crossUp185 = prev.ma3 < prev.ma185 && curr.ma3 >= curr.ma185;
        const bandEntry = curr.ma3 >= curr.ma185 && curr.ma3 <= curr.envUpper;
        const exceptionEntry = curr.ma3 < curr.envUpper && curr.ma3 > curr.ma161 && curr.ma161 > curr.ma185;

        const sellNormal = curr.ma3 < curr.ma161;
        const sellException = curr.ma3 < curr.ma185;
        const recoverToNormal = prev.ma3 <= prev.ma161 && curr.ma3 > curr.ma161;

        if (state === "보유(기본)" && sellNormal) {
          state = "미보유";
          activeSellLine = "-";
          todaySignal = "매도";
          blockReentryToday = true;
          tradedToday = true;
        } else if (state === "보유(예외)" && sellException) {
          state = "미보유";
          activeSellLine = "-";
          todaySignal = "매도";
          blockReentryToday = true;
          tradedToday = true;
        }

        if (!tradedToday && state === "보유(예외)" && recoverToNormal) {
          state = "보유(기본)";
          activeSellLine = "161일선";
          todaySignal = "보유";
        }

        if (!tradedToday && state === "미보유" && !blockReentryToday) {
          if (exceptionEntry) {
            state = "보유(예외)";
            activeSellLine = "185일선";
            entryDate = curr.date;
            entryPrice = tqqqPrice;
            todaySignal = "매수";
            tradedToday = true;
          } else if (crossUp185 || bandEntry) {
            state = "보유(기본)";
            activeSellLine = "161일선";
            entryDate = curr.date;
            entryPrice = tqqqPrice;
            todaySignal = "매수";
            tradedToday = true;
          } else {
            todaySignal = "관망";
          }
        } else if (!tradedToday && state !== "미보유") {
          todaySignal = "보유";
          activeSellLine = activeSellLine === "-" ? "161일선" : activeSellLine;
        }
      }

      const currT = tqqqRows[tqqqRows.length - 1]?.close ?? null;
      let strategyReturnPct = null;
      if (state !== "미보유" && entryPrice && currT) {
        strategyReturnPct = ((currT / entryPrice) - 1) * 100;
      }

      return { state, activeSellLine, entryDate, todaySignal, strategyReturnPct };
    }

    function drawChart(rows) {
      const canvas = document.getElementById("chart");
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      const pad = { top: 6, right: 4, bottom: 6, left: 4 };

      const series = [
        { key: "close", color: SETTINGS.colors.qqqClose, width: 1.4 },
        { key: "ma3", color: SETTINGS.colors.ma3, width: 1.1 },
        { key: "ma161", color: SETTINGS.colors.ma161, width: 0.9 },
        { key: "ma185", color: SETTINGS.colors.ma185, width: 0.9 },
        { key: "envUpper", color: SETTINGS.colors.env185, width: 0.9 }
      ];

      const values = [];
      rows.forEach(r => series.forEach(s => {
        if (r[s.key] != null) values.push(r[s.key]);
      }));

      if (!values.length) return;

      const minV = Math.min(...values);
      const maxV = Math.max(...values);
      const chartW = w - pad.left - pad.right;
      const chartH = h - pad.top - pad.bottom;

      // 그리드 가이드라인
      ctx.strokeStyle = "rgba(55, 65, 81, 0.4)";
      ctx.lineWidth = 0.5;
      for (let i = 0; i < 3; i++) {
        const y = pad.top + (chartH / 2) * i;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + chartW, y);
        ctx.stroke();
      }

      // 라인 차트
      series.forEach(s => {
        ctx.beginPath();
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.width;
        let started = false;

        rows.forEach((r, idx) => {
          const v = r[s.key];
          if (v == null) return;
          const x = pad.left + (idx / (rows.length - 1)) * chartW;
          const y = pad.top + chartH - ((v - minV) / (maxV - minV)) * chartH;
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        });
        ctx.stroke();
      });
    }

    async function init() {
      const loader = document.getElementById("loading");
      loader.style.display = "flex";

      try {
        const res = await fetch(`./data.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("파일 없음");
        const data = await res.json();

        const qqqData = data.qqq;
        const tqqqData = data.tqqq;

        const qqqWithMA = buildIndicators(qqqData);
        const strategy = simulateStrategy(qqqWithMA, tqqqData);

        const latestQQQ = qqqWithMA[qqqWithMA.length - 1];
        const latestTQQQ = tqqqData[tqqqData.length - 1];
        const prevTQQQ = tqqqData[tqqqData.length - 2];

        // 시그널
        const signalEl = document.getElementById("todaySignal");
        signalEl.textContent = strategy.todaySignal;
        signalEl.className = "signal " + (strategy.todaySignal === "매수" ? "signal-up" : strategy.todaySignal === "매도" ? "signal-down" : "signal-neutral");

        // TQQQ 가격
        document.getElementById("tqqqPrice").textContent = `TQQQ $${latestTQQQ.close.toFixed(2)}`;
        const chg = latestTQQQ.close - prevTQQQ.close;
        const chgPct = (chg / prevTQQQ.close) * 100;
        const chgEl = document.getElementById("tqqqChange");
        chgEl.textContent = `${chg >= 0 ? "+" : ""}${chg.toFixed(2)} (${chgPct >= 0 ? "+" : ""}${chgPct.toFixed(2)}%)`;
        chgEl.className = "change " + (chg >= 0 ? "price-up" : "price-down");

        // 상태 / 매도선
        document.getElementById("strategyState").textContent = `상태 ${strategy.state}`;
        document.getElementById("activeSellLine").textContent = `매도선 ${strategy.activeSellLine}`;

        // QQQ 종가
        document.getElementById("qqqPrice").textContent = `QQQ $${latestQQQ.close.toFixed(2)}`;

        // 진입일 & 수익률
        document.getElementById("entryDate").textContent = `진입 ${strategy.entryDate || "-"}`;
        const returnEl = document.getElementById("strategyReturn");
        if (strategy.strategyReturnPct != null) {
          returnEl.textContent = `전략 ${strategy.strategyReturnPct >= 0 ? "+" : ""}${strategy.strategyReturnPct.toFixed(2)}%`;
          returnEl.className = "return-text " + (strategy.strategyReturnPct >= 0 ? "price-up" : "price-down");
        } else {
          returnEl.textContent = "전략 -";
        }

        // 이평선 & 갱신시각
        document.getElementById("maDetails").textContent = `3일 $${latestQQQ.ma3?.toFixed(1)} / 161일 $${latestQQQ.ma161?.toFixed(1)}`;
        document.getElementById("updatedAt").textContent = `${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} 갱신`;

        // 하단 차트 렌더링
        drawChart(qqqWithMA.slice(-SETTINGS.graphDays));
        loader.style.display = "none";
      } catch (err) {
        loader.textContent = "갱신 실패 (터치 재시도)";
      }
    }

    window.onload = init;
    window.onresize = () => init();
  </script>
</body>
</html>
