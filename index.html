<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QQQ / TQQQ 전략 위젯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Segoe UI", Roboto, Helvetica, sans-serif;
      background: linear-gradient(145deg, #0b0f19 0%, #151d30 100%);
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      gap: 10px;
      user-select: none;
    }

    /* 1. 상단 바 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-title {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .title-text {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #f9fafb;
    }
    .update-badge {
      font-size: 10px;
      font-weight: 500;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 10px;
    }

    /* 시그널 칩 배지 */
    .signal-chip {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .signal-chip::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .signal-up {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }
    .signal-up::before { background: #4ade80; }

    .signal-down {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .signal-down::before { background: #f87171; }

    .signal-neutral {
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .signal-neutral::before { background: #94a3b8; }

    /* 2. 메인 정보 카드 */
    .card {
      background: rgba(26, 35, 54, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price-container {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .tqqq-val {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.3px;
      color: #ffffff;
    }
    .change-val {
      font-size: 12px;
      font-weight: 700;
    }
    .qqq-val {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
    }

    .chips-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .pill-accent {
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .pill-return {
      font-weight: 800;
    }

    .val-up { color: #4ade80; }
    .val-down { color: #f87171; }

    /* 이평선 레전드 */
    .legend-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 9px;
      color: #94a3b8;
      padding-top: 4px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      margin-right: 3px;
    }

    /* 3. 하단 곡선 차트 */
    .chart-container {
      width: 100%;
      flex: 1;
      min-height: 60px;
      background: rgba(14, 20, 34, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading {
      position: absolute;
      inset: 0;
      background: #0b0f19;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      z-index: 20;
    }
  </style>
</head>
<body onclick="init()">
  <div id="loading">✨ 위젯 동기화 중...</div>

  <!-- 최상단 타이틀 & 시그널 배지 -->
  <div class="top-bar">
    <div class="app-title">
      <span class="title-text">⚡ TQQQ / QQQ 전략</span>
      <span class="update-badge" id="updatedAt">갱신 대기</span>
    </div>
    <div id="todaySignal" class="signal-chip signal-neutral">-</div>
  </div>

  <!-- 메인 정보 카드 -->
  <div class="card">
    <div class="card-row">
      <div class="price-container">
        <span class="tqqq-val" id="tqqqPrice">TQQQ $--</span>
        <span class="change-val" id="tqqqChange">-</span>
      </div>
      <div class="chips-group">
        <span class="pill pill-accent" id="strategyState">상태 -</span>
        <span class="pill" id="activeSellLine">매도선 -</span>
      </div>
    </div>

    <div class="card-row">
      <div class="qqq-val" id="qqqPrice">QQQ $--</div>
      <div class="chips-group">
        <span class="pill" id="entryDate">진입 -</span>
        <span class="pill pill-return" id="strategyReturn">수익률 -</span>
      </div>
    </div>

    <!-- 범례 및 실시간 수치 -->
    <div class="legend-bar">
      <span><span class="dot" style="background:#fbbf24;"></span>3일 <b id="ma3Val" style="color:#e2e8f0;">-</b></span>
      <span><span class="dot" style="background:#60a5fa;"></span>161일 <b id="ma161Val" style="color:#e2e8f0;">-</b></span>
      <span><span class="dot" style="background:#34d399;"></span>185일 <b id="ma185Val" style="color:#e2e8f0;">-</b></span>
    </div>
  </div>

  <!-- 하단 소프트 차트 -->
  <div class="chart-container">
    <canvas id="chart"></canvas>
  </div>

  <script>
    const SETTINGS = {
      shortMA: 3,
      sellMA: 161,
      baseMA: 185,
      envelopePct: 0.05,
      graphDays: 90,
      colors: {
        qqqClose: "#f1f5f9",
        ma3: "#fbbf24",
        ma161: "#60a5fa",
        ma185: "#34d399",
        env185: "#f43f5e"
      }
    };

    function sma(values, endIdx, period) {
      if (endIdx - period + 1 < 0) return null;
      let sum = 0;
      for (let i = endIdx - period + 1; i <= endIdx; i++) {
        if (values[i] == null) return null;
        sum += values[i];
      }
      return sum / period;
    }

    function buildIndicators(rows) {
      const closes = rows.map(r => r.close);
      return rows.map((row, idx) => {
        const ma3 = sma(closes, idx, SETTINGS.shortMA);
        const ma161 = sma(closes, idx, SETTINGS.sellMA);
        const ma185 = sma(closes, idx, SETTINGS.baseMA);
        const envUpper = ma185 != null ? ma185 * (1 + SETTINGS.envelopePct) : null;
        return { ...row, ma3, ma161, ma185, envUpper };
      });
    }

    function simulateStrategy(qqqRows, tqqqRows) {
      let state = "미보유";
      let activeSellLine = "-";
      let blockReentryToday = false;
      let entryDate = null;
      let entryPrice = null;
      let todaySignal = "관망";

      for (let i = 1; i < qqqRows.length; i++) {
        const prev = qqqRows[i - 1];
        const curr = qqqRows[i];

        if (![prev.ma3, prev.ma161, prev.ma185, prev.envUpper, curr.ma3, curr.ma161, curr.ma185, curr.envUpper].every(v => v != null)) {
          continue;
        }

        blockReentryToday = false;
        let tradedToday = false;
        const tqqqPrice = tqqqRows[Math.min(i, tqqqRows.length - 1)]?.close ?? null;

        const crossUp185 = prev.ma3 < prev.ma185 && curr.ma3 >= curr.ma185;
        const bandEntry = curr.ma3 >= curr.ma185 && curr.ma3 <= curr.envUpper;
        const exceptionEntry = curr.ma3 < curr.envUpper && curr.ma3 > curr.ma161 && curr.ma161 > curr.ma185;

        const sellNormal = curr.ma3 < curr.ma161;
        const sellException = curr.ma3 < curr.ma185;
        const recoverToNormal = prev.ma3 <= prev.ma161 && curr.ma3 > curr.ma161;

        if (state === "보유(기본)" && sellNormal) {
          state = "미보유";
          activeSellLine = "-";
          todaySignal = "매도";
          blockReentryToday = true;
          tradedToday = true;
        } else if (state === "보유(예외)" && sellException) {
          state = "미보유";
          activeSellLine = "-";
          todaySignal = "매도";
          blockReentryToday = true;
          tradedToday = true;
        }

        if (!tradedToday && state === "보유(예외)" && recoverToNormal) {
          state = "보유(기본)";
          activeSellLine = "161일선";
          todaySignal = "보유";
        }

        if (!tradedToday && state === "미보유" && !blockReentryToday) {
          if (exceptionEntry) {
            state = "보유(예외)";
            activeSellLine = "185일선";
            entryDate = curr.date;
            entryPrice = tqqqPrice;
            todaySignal = "매수";
            tradedToday = true;
          } else if (crossUp185 || bandEntry) {
            state = "보유(기본)";
            activeSellLine = "161일선";
            entryDate = curr.date;
            entryPrice = tqqqPrice;
            todaySignal = "매수";
            tradedToday = true;
          } else {
            todaySignal = "관망";
          }
        } else if (!tradedToday && state !== "미보유") {
          todaySignal = "보유";
          activeSellLine = activeSellLine === "-" ? "161일선" : activeSellLine;
        }
      }

      const currT = tqqqRows[tqqqRows.length - 1]?.close ?? null;
      let strategyReturnPct = null;
      if (state !== "미보유" && entryPrice && currT) {
        strategyReturnPct = ((currT / entryPrice) - 1) * 100;
      }

      return { state, activeSellLine, entryDate, todaySignal, strategyReturnPct };
    }

    // 부드러운 곡선(Bezier Curve) 렌더링 함수
    function drawSmoothLine(ctx, points, color, width, glow = false) {
      if (points.length < 2) return;

      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.moveTo(points[0].x, points[0].y);

      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i === 0 ? 0 : i - 1];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || p2;

        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;

        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawChart(rows) {
      const canvas = document.getElementById("chart");
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      const pad = { top: 12, right: 6, bottom: 10, left: 6 };

      const seriesKeys = ["close", "ma3", "ma161", "ma185", "envUpper"];
      const values = [];
      rows.forEach(r => seriesKeys.forEach(k => {
        if (r[k] != null) values.push(r[k]);
      }));

      if (!values.length) return;

      const minV = Math.min(...values);
      const maxV = Math.max(...values);
      const chartW = w - pad.left - pad.right;
      const chartH = h - pad.top - pad.bottom;

      // 배경 미세 점선 가이드
      ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
      ctx.setLineDash([3, 4]);
      ctx.lineWidth = 1;
      for (let i = 1; i <= 2; i++) {
        const y = pad.top + (chartH / 3) * i;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + chartW, y);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      const seriesConfig = [
        { key: "envUpper", color: SETTINGS.colors.env185, width: 1.2 },
        { key: "ma185", color: SETTINGS.colors.ma185, width: 1.2 },
        { key: "ma161", color: SETTINGS.colors.ma161, width: 1.4 },
        { key: "ma3", color: SETTINGS.colors.ma3, width: 1.8 },
        { key: "close", color: SETTINGS.colors.qqqClose, width: 2.2, glow: true }
      ];

      seriesConfig.forEach(s => {
        const points = [];
        rows.forEach((r, idx) => {
          const v = r[s.key];
          if (v != null) {
            const x = pad.left + (idx / (rows.length - 1)) * chartW;
            const y = pad.top + chartH - ((v - minV) / (maxV - minV)) * chartH;
            points.push({ x, y });
          }
        });

        // 메인 주가 선 하단 은은한 그라데이션 광채 채우기
        if (s.key === "close" && points.length > 1) {
          const grad = ctx.createLinearGradient(0, pad.top, 0, h);
          grad.addColorStop(0, "rgba(241, 245, 249, 0.12)");
          grad.addColorStop(1, "rgba(241, 245, 249, 0.0)");
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
          }
          ctx.lineTo(points[points.length - 1].x, h);
          ctx.lineTo(points[0].x, h);
          ctx.closePath();
          ctx.fillStyle = grad;
          ctx.fill();
        }

        drawSmoothLine(ctx, points, s.color, s.width, s.glow);
      });
    }

    async function init() {
      const loader = document.getElementById("loading");
      loader.style.display = "flex";

      try {
        const res = await fetch(`./data.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("파일 없음");
        const data = await res.json();

        const qqqData = data.qqq;
        const tqqqData = data.tqqq;

        const qqqWithMA = buildIndicators(qqqData);
        const strategy = simulateStrategy(qqqWithMA, tqqqData);

        const latestQQQ = qqqWithMA[qqqWithMA.length - 1];
        const latestTQQQ = tqqqData[tqqqData.length - 1];
        const prevTQQQ = tqqqData[tqqqData.length - 2];

        // 시그널 배지
        const signalEl = document.getElementById("todaySignal");
        signalEl.textContent = strategy.todaySignal;
        signalEl.className = "signal-chip " + (strategy.todaySignal === "매수" ? "signal-up" : strategy.todaySignal === "매도" ? "signal-down" : "signal-neutral");

        // 가격
        document.getElementById("tqqqPrice").textContent = `TQQQ $${latestTQQQ.close.toFixed(2)}`;
        const chg = latestTQQQ.close - prevTQQQ.close;
        const chgPct = (chg / prevTQQQ.close) * 100;
        const chgEl = document.getElementById("tqqqChange");
        chgEl.textContent = `${chg >= 0 ? "+" : ""}${chg.toFixed(2)} (${chgPct >= 0 ? "+" : ""}${chgPct.toFixed(2)}%)`;
        chgEl.className = "change-val " + (chg >= 0 ? "val-up" : "val-down");

        document.getElementById("qqqPrice").textContent = `QQQ $${latestQQQ.close.toFixed(2)}`;

        // 상태 배지 텍스트
        document.getElementById("strategyState").textContent = strategy.state;
        document.getElementById("activeSellLine").textContent = `매도선 ${strategy.activeSellLine}`;
        document.getElementById("entryDate").textContent = `진입 ${strategy.entryDate ? strategy.entryDate.slice(5) : "-"}`;

        const returnEl = document.getElementById("strategyReturn");
        if (strategy.strategyReturnPct != null) {
          returnEl.textContent = `수익 ${strategy.strategyReturnPct >= 0 ? "+" : ""}${strategy.strategyReturnPct.toFixed(2)}%`;
          returnEl.className = "pill pill-return " + (strategy.strategyReturnPct >= 0 ? "val-up" : "val-down");
        } else {
          returnEl.textContent = "수익 -";
        }

        // 범례 수치
        document.getElementById("ma3Val").textContent = `$${latestQQQ.ma3?.toFixed(1)}`;
        document.getElementById("ma161Val").textContent = `$${latestQQQ.ma161?.toFixed(1)}`;
        document.getElementById("ma185Val").textContent = `$${latestQQQ.ma185?.toFixed(1)}`;

        document.getElementById("updatedAt").textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        drawChart(qqqWithMA.slice(-SETTINGS.graphDays));
        loader.style.display = "none";
      } catch (err) {
        loader.textContent = "터치하여 갱신";
      }
    }

    window.onload = init;
    window.onresize = () => init();
  </script>
</body>
</html>
