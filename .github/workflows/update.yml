name: Update Market Data

on:
  schedule:
    # 매일 한국 시간 오전 6시 30분(미국 장 마감 후) 자동 실행
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch QQQ and TQQQ Data
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          function fetchJson(url) {
            return new Promise((resolve, reject) => {
              https.get(url, { headers: { "User-Agent": "Mozilla/5.0" } }, (res) => {
                let data = "";
                res.on("data", chunk => data += chunk);
                res.on("end", () => {
                  try { resolve(JSON.parse(data)); } catch(e) { reject(e); }
                });
              }).on("error", reject);
            });
          }

          function parseYahoo(json) {
            const result = json?.chart?.result?.[0];
            if (!result) return [];
            const timestamps = result.timestamp || [];
            const closes = result.indicators?.quote?.[0]?.close || [];
            const rows = [];
            for (let i = 0; i < timestamps.length; i++) {
              if (closes[i] != null) {
                rows.push({
                  date: new Date(timestamps[i] * 1000).toISOString().slice(0, 10),
                  close: closes[i]
                });
              }
            }
            return rows;
          }

          async function main() {
            const qqqRaw = await fetchJson("https://query1.finance.yahoo.com/v8/finance/chart/QQQ?range=2y&interval=1d");
            const tqqqRaw = await fetchJson("https://query1.finance.yahoo.com/v8/finance/chart/TQQQ?range=2y&interval=1d");
            
            const payload = {
              updatedAt: new Date().toISOString(),
              qqq: parseYahoo(qqqRaw),
              tqqq: parseYahoo(tqqqRaw)
            };

            fs.writeFileSync("data.json", JSON.stringify(payload));
          }

          main().catch(err => { console.error(err); process.exit(1); });
          '

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stock data" && git push)
