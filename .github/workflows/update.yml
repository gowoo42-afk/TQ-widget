name: TQQQ 200MA Widget Image Builder

on:
  schedule:
    # 한국 시간 화~토 오전 6시 30분 (미국 증시 마감 후)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # 깃허브 웹에서 'Run workflow' 버튼으로 즉시 실행 가능

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          fc-cache -fv

      - name: 필요 패키지 설치
        run: |
          pip install yfinance pandas numpy matplotlib pillow requests

      - name: 위젯 이미지(widget.png) 생성
        run: python generate_widget.py

      - name: 변경된 widget.png 커밋 및 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add widget.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update: widget.png" && git push)
